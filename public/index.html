<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Welcome back</h1>
      <p class="helper">Login to access your dashboard.</p>
      <form id="loginForm">
        <label>Email</label>
        <input type="email" id="email" required />
        <label>Password</label>
        <div class="password-container">
          <input type="password" id="password" required />
          <i id="togglePassword" class="fa fa-eye"></i>
        </div>

        <button type="submit">Login</button>
      </form>
      <p style="margin-top: 12px; font-size: 14px">
        No account? <a class="link" href="/register.html">Register</a>
      </p>
      <div id="msg" style="margin-top: 12px; color: #ffb4b4"></div>
    </div>
    <script src="/shared.js"></script>
    <script>
      const form = document.getElementById("loginForm");
      const msg = document.getElementById("msg");

      const togglePassword = document.getElementById("togglePassword");
      const passwordInput = document.getElementById("password");

      togglePassword.addEventListener("click", () => {
        const type = passwordInput.type === "password" ? "text" : "password";
        passwordInput.type = type;

        togglePassword.classList.toggle("fa-eye");
        togglePassword.classList.toggle("fa-eye-slash");
      });
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        msg.textContent = "";
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const res = await fetch(`https://printcorner.onrender.com/api/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
          credentials: "include",
        });
        const data = await res.json();
        if (!res.ok) {
          msg.textContent = data.error || "Login failed";
          return;
        }
        if (data.role === "admin") window.location.href = "/admin.html";
        else window.location.href = "/user.html";
      });
    </script>
  </body>
</html>
